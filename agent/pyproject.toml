[project]
name = "careersim-agent"
version = "1.0.0"
description = "LangGraph-based conversation agent with Gradio developer UI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=1.2.12",
    # Floor raised for PYSEC-2026-2192 (fixed in 1.3.9).
    "langchain>=1.4.3",
    "langchain-openai>=1.6.6",
    "langchain-chroma>=1.1.0",
    "langchain-text-splitters>=1.1.2",
    # Floor raised for PYSEC-2026-2179 (fixed in 6.16.0).
    "gradio>=6.29.0",
    "fastapi>=0.142.2",
    # FastAPI pulls starlette; floor raised for PYSEC-2026-248/-249/-2280/-2281.
    "starlette>=1.7.0",
    "uvicorn>=0.54.0",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.3",
    "httpx>=0.28.1",
    # Used when PERSONAS_S3_ENABLED=true to pull cast data into agent/data.
    "boto3>=1.43.105",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
]
# ---- Local cross-encoder reranker -------------------------------------
# Pulled only into images/environments that set RAG_RERANK_ENABLED=true.
# The import inside careersim_agent.services.reranker is lazy, so the
# base agent and the pytest suite don't need torch installed.
rerank = [
    "sentence-transformers>=6.1.0",
]
# ---- Voice mode (self-hosted defaults) -------------------------------
# Installed only into the `agent-voice` worker image (see
# docker-compose.local.yml) — the regular `agent` chat process and the
# pytest suite don't need them. All imports inside
# `careersim_agent.voice.providers` are lazy, so this extra stays
# truly optional at module-load time.
voice = [
    "livekit-agents>=1.8.3",
    "livekit-plugins-silero>=1.8.3",
    "faster-whisper>=1.2.1",
    "piper-tts>=1.8.0",
    "websockets>=16.1.1",
]
# Premium / opt-in cloud voice providers. Pull on top of the `voice`
# extra when the deployment selects Deepgram or ElevenLabs.
voice-cloud = [
    "deepgram-sdk>=7.11.0",
    "livekit-plugins-deepgram>=1.8.3",
    "livekit-plugins-elevenlabs>=1.8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/careersim_agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["src/careersim_agent"]
branch = true
omit = [
    # CLI entrypoint (`python -m careersim_agent.main`) — a thin argparse
    # dispatcher with no business logic; exercised manually, not worth a
    # process-spawning test.
    "src/careersim_agent/main.py",
    # Dev-only Gradio console for manually poking at the agent. Never
    # runs in production (the FastAPI app + agent-voice worker are the
    # real entrypoints) and pulls in a full Gradio UI to exercise.
    "src/careersim_agent/ui/*",
]

[tool.coverage.report]
show_missing = true
exclude_also = [
    "if __name__ == .__main__.:",
]
